# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks

ci:
  autoupdate_schedule: monthly

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # v6.0.0
    hooks:
    - id: check-added-large-files
    - id: check-json
      types: [file]  # override `types: [json]`
      files: \.(json|ipynb)$
    - id: check-yaml
    - id: check-toml
    - id: end-of-file-fixer
    - id: trailing-whitespace
  - repo: https://github.com/tox-dev/pyproject-fmt
    rev: a72ae8edd6eeddb9d942168912362945651212f8 # frozen: v2.30.1
    hooks:
    - id: pyproject-fmt
  - repo: https://github.com/abravalheri/validate-pyproject
    rev: 17e12779811926f000bdfa1795f9e3735dd71ac3 # frozen: 0.26
    hooks:
    - id: validate-pyproject
  - repo: https://github.com/psf/black-pre-commit-mirror
    rev: 96ae3e5802f3fe2d551e703e18f0a367d1a81ac2 # frozen: 26.10.0
    hooks:
    - id: black
  - repo: https://github.com/asottile/reorder-python-imports
    rev: 5e38415c12154247a099c7023c210e3d458275b5 # v3.17.0
    hooks:
    - id: reorder-python-imports
  - repo: https://github.com/pycqa/flake8
    rev: 7eccf20b526fe4f2230bf9afeeef2fc9f97faf8d # frozen: 7.4.1
    hooks:
    - id: flake8
      language_version: python3
  - repo: https://github.com/sphinx-contrib/sphinx-lint
    rev: c883505f64b59c3c5c9375191e4ad9f98e727ccd # v1.0.2
    hooks:
    - id: sphinx-lint
      types: [rst]
