# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks

ci:
  autoupdate_schedule: monthly

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # v6.0.0
    hooks:
    - id: check-added-large-files
    - id: check-json
      types: [file]  # override `types: [json]`
      files: \.(json|ipynb)$
    - id: check-yaml
    - id: check-toml
    - id: end-of-file-fixer
    - id: trailing-whitespace
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: 06a39750ec31860bb44f2acf67182c40016cd1e7  # frozen: v1.32.0
    hooks:
    - id: zizmor
  - repo: https://github.com/tox-dev/pyproject-fmt
    rev: 44297c38117367c60ae9aeb270694de876ddcddf # frozen: v2.31.1
    hooks:
    - id: pyproject-fmt
  - repo: https://github.com/abravalheri/validate-pyproject
    rev: 82d21874c3242e4dc27bb47641c996902ef64eef # frozen: v0.27
    hooks:
    - id: validate-pyproject
  - repo: https://github.com/psf/black-pre-commit-mirror
    rev: a5439e9af2ff9371297bb1a76a01b8ad17989b88 # frozen: 26.10.1
    hooks:
    - id: black
  - repo: https://github.com/asottile/reorder-python-imports
    rev: 4690733311bbfba33558e4d50a7f0092c64d78d8 # frozen: v3.19.0
    hooks:
    - id: reorder-python-imports
  - repo: https://github.com/pycqa/flake8
    rev: 1c7fec1973ed3a7c192dbe1e96906fbbd1dbe49e # frozen: 7.5.0
    hooks:
    - id: flake8
      language_version: python3
  - repo: https://github.com/sphinx-contrib/sphinx-lint
    rev: c883505f64b59c3c5c9375191e4ad9f98e727ccd # v1.0.2
    hooks:
    - id: sphinx-lint
      types: [rst]
